name: gearlease
description: "GearLease Mobile — Enterprise FinTech Equipment Leasing & Fleet Telemetry Client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Networking & Streaming
  dio: ^5.4.3+1
  web_socket_channel: ^3.0.1
  rxdart: ^0.27.7

  # Persistence & Security
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  crypto: ^3.0.3

  # Native Hardware & Utilities
  mobile_scanner: ^5.2.3
  local_auth: ^2.2.0
  signature: ^5.4.1
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  connectivity_plus: ^6.0.3
  workmanager: ^0.5.2

  # UI & Visualization
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  intl: ^0.19.0
  uuid: ^4.4.0

  # Dependency Injection
  get_it: ^7.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.4
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true
