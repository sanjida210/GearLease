name: GearLease CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Static Analysis & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Code Analysis (--fatal-infos)
        run: flutter analyze --fatal-infos

      - name: Run Test Suite with Coverage
        run: flutter test --coverage

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov-coverage-report
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Build Android Dev & Production Artifacts
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Dev APK
        run: flutter build apk --debug -t lib/main_dev.dart

      - name: Build Obfuscated Prod AppBundle (with split debug symbols)
        run: |
          mkdir -p build/app/outputs/symbols
          flutter build appbundle --release -t lib/main_prod.dart --obfuscate --split-debug-info=./build/app/outputs/symbols

      - name: Upload Dev APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gearlease-dev-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: ignore

      - name: Upload Release AppBundle & Symbols Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gearlease-prod-release-bundle
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/symbols/
          if-no-files-found: ignore

  build-verification-targets:
    name: Cross-Platform & Desktop Verification
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web Verification Target
        run: flutter build web --release -t lib/main_prod.dart

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gearlease-web-bundle
          path: build/web/
          if-no-files-found: ignore
